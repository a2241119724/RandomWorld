# Worker 行为决策模型 —— 训练/模型超参数

paths:
  schema: config/feature_schema.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  export_dir: experiments

data:
  train_sampling: extreme             # [固定] 训练集采样：纯极值随机组合（连续特征只取 {min,max}、枚举取全值，随机组合 n_train_total 条）。规则表已删除，采样信息全在 feature_schema（ratio.max_value / dtype:int）；值含于 LLM 缓存 key，改采样方式需换新值使旧标签缓存失效
  n_train_total: 1000                 # 训练集条数（纯极值随机组合，每条为不同极值状态组合；组合空间≈770亿故抽样而非枚举）
  n_test: 500                         # 现实分布测试集条数（原 20000 → 用户改为 500，网页版打标快）
  seed: 42                            # 复现用随机种子
  save_raw_csv: true                  # 是否落盘原始 (state, action) CSV

split:
  val_ratio: 0.5                      # 现实分布测试集切给验证集的比例（早停监控中间态真实泛化；其余为独立测试集）。训练集全部用于训练，不再内部切分

mlp:
  hidden_dims: [64, 64, 64, 32]  # 隐藏层维度（256-128 ≈10万参数对 384 条训练样本严重过参数化→过拟合坍缩到主类；64-64-64-32 = 4 隐藏+1 输出共 5 层，约 11k 参数，用户要求加深）
  dropout: 0.1
  activation: relu

attention:
  d_model: 256                 # token 维度（需能被 n_heads 整除）
  n_heads: 4                   # 多头注意力头数（256/4 = 每头 64）
  n_layers: 5                  # Transformer 编码器层数（用户要求 2→5；加深 + 小数据 → 过拟合更早，val 早停兜底）
  dim_feedforward: 1024        # FFN 隐藏维度（4× d_model）
  dropout: 0.2                 # 大模型 + 小数据，加大正则防过拟合
  head_dims: [128, 64]         # MLP 分类头隐藏层（用户要求加深：2 隐藏+1 输出）

gbdt:                          # sklearn GBDT（注册名 gbdt）。树阈值分裂能从极值点泛化到中间态
  algorithm: hist_gradient_boosting   # hist_gradient_boosting | random_forest（RF 实测同样坍缩，仅备选）
  max_iter: 300                # HGB 最大提升轮数（RF 映射为 n_estimators）
  learning_rate: 0.05          # 低学习率 → 更平滑的概率斜坡（RF 忽略）
  max_leaf_nodes: 15           # 子树叶数上限（小 → 平滑、抗过拟合）
  min_samples_leaf: 5          # 叶最小样本数（抗物理拷贝重复样本过拟合）
  l2_regularization: 1.0       # HGB 叶值 L2（RF 忽略）
  early_stopping: true         # 外部 val_logloss 早停（warm_start 续训）；不用 HGB 内置——stratify 在单样本类上崩溃
  patience: 8                  # val_logloss 连续 patience 次不降即停（对齐 training.patience）
  class_weight: none           # HGB 不支持 class_weight；靠 sample_proportions 拷贝控类分布

training:
  batch_size: 32               # 训练集 10000 条时每 epoch=312 步（此前 364 条 + batch 256 时每 epoch≈1 步导致欠训练，已弃用）
  epochs: 100                  # 用户降 lr 实验配套：0.0001 在 50 epoch 内收敛，0.00001 收敛慢需加倍 epoch，避免欠拟合误判
  learning_rate: 0.00001             # 用户要求再降（0.001→0.0001→0.00001）；README 已记 0.0001 只让坍缩更平滑不改变坍缩，本轮做量级对照排除 lr
  weight_decay: 0.0001
  patience: 8                  # 早停：验证 loss 连续 patience 轮不降即停止
  class_weight: none           # loss 权重缓解长尾（none/sqrt_inv/inverse）；sample_proportions 开启时被重采样替代，置 none
  sample_proportions:          # 每 epoch 重采样训练集的目标行为比例（训练时各类别占比 == 游戏内正常比例）。sum≈1，只覆盖训练集已观测类；改比例后重新 train 即可
    self_gather: 0.60          # 干活主导（对齐 Gather:Sleep≈9:1 方向），游戏内正常比例初始值
    self_build: 0.15
    idle: 0.10
    eat: 0.08
    sleep: 0.04
    ground_sleep: 0.03

export:
  onnx: true                   # 导出 ONNX
  weights_json: true           # 导出纯权重 JSON（供 C# 手写前向传播）

llm:
  provider: web                # 标签教师：deepseek=OpenAI 兼容 API（付费）/ web=网页版浏览器自动化（免费，可反复重打）
  model: deepseek-chat         # 仅 deepseek 教师使用
  model_fallbacks: [deepseek-reasoner]  # 当前模型重试耗尽后换模型再试（用户要求失败不兜底 idle）
  base_url: https://api.deepseek.com
  temperature: 0.0             # 确定性（配合缓存固化，数据可复现；web 教师无法控制，靠缓存固化）
  batch_size: 32               # 每批状态条数
  timeout: 60                  # 单次请求超时（秒）
  max_retries: 3               # 非法/超时重试次数
  cache_dir: data/cache        # LLM 标签缓存目录（同 seed + 同 prompt 幂等复用）
  web:                         # 网页版浏览器自动化打标签（免费，避免特征扩展后反复付费）
    platforms: [deepseek, wenxin, qianwen, mimo]  # 参与打标的平台（ark 已删：在线体验有时限；doubao 已删：大 prompt 整批回显 + 触发人机验证）
    batch_size: 64             # 每批状态条数（网页版推理快，64 条/批生成约 5s；实测关深度思考后提速明显）
    headless: false            # 有头模式：首次需手动登录各平台（一次性，profile 复用，每平台一个子目录）
    profile_dir: data/browser_profile   # 浏览器登录会话根目录（每平台 <profile_dir>/<平台名>/，不存密码）
    delay_sec: 2               # 批间停顿（秒），降低触发限流/反爬概率（生成后已留稳定等待）
    stable_sec: 3              # 回复稳定判定秒数；回复以 `}` 结尾时 1.5s 即完成
    chat_timeout: 240          # 单条回复等待上限（秒）
    login_timeout: 300         # 登录等待上限（秒）
    check_timeout: 60          # 并行池可用性快速判定超时（秒）：未登录/未校准的平台快速排除（6 浏览器并行启动负载高，30s 不够）
    max_test_relabel_batches: 60   # 网页版重打测试集批数上限（20000/32=625 批不可行，超限自动拒绝）

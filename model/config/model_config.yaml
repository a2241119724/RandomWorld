# Worker 行为决策模型 —— 训练/模型超参数

paths:
  schema: config/feature_schema.yaml
  raw_dir: data/raw
  processed_dir: data/processed
  export_dir: experiments

data:
  num_samples: 200000          # 模拟器采样条数
  seed: 42                     # 复现用随机种子
  save_raw_csv: true           # 是否落盘原始 (state, action) CSV

split:
  val_ratio: 0.2
  test_ratio: 0.1

baseline:
  # 效用函数用逻辑回归（sklearn）学习权重；C 为正则化强度的倒数
  C: 1.0
  max_iter: 2000

mlp:
  hidden_dims: [256, 128]      # 隐藏层维度
  dropout: 0.1
  activation: relu

attention:
  d_model: 256                 # token 维度（需能被 n_heads 整除）
  n_heads: 4                   # 多头注意力头数（256/4 = 每头 64）
  n_layers: 2                  # Transformer 编码器层数
  dim_feedforward: 1024        # FFN 隐藏维度（4× d_model）
  dropout: 0.2                 # 大模型 + 小数据，加大正则防过拟合
  head_dims: [128]             # MLP 分类头隐藏层

training:
  batch_size: 256
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 8                  # 早停：验证 loss 连续 patience 轮不降即停止
  class_weight: sqrt_inv       # 类别权重缓解长尾标签被大类主导：none / sqrt_inv(推荐) / inverse

export:
  onnx: true                   # 导出 ONNX
  weights_json: true           # 导出纯权重 JSON（供 C# 手写前向传播）

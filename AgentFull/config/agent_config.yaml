agent:
  name: AgentFull
  version: "1.0.0"
  default_task: auto_discover_and_implement
  language: zh-CN

logging:
  level: INFO
  write_log_file: true

context:
  max_chars: 24000
  keep_recent_results: 12

cache:
  enabled: true
  project_scan_cache: project_scan_cache.json
  script_analysis_cache: script_analysis_cache.json

skills:
  enabled:
    - scan_unity_project
    - analyze_csharp_scripts
    - discover_feature_gap
    - generate_feature_task
    - generate_csharp_script
    - generate_unity_editor_tool
    - asset_reference_check
    - write_report
    - update_feature_status

agents:
  enabled:
    - project_analyzer
    - feature_planner
    - code_generator
    - unity_editor
    - validation
    - report

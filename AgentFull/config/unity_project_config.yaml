unity_project:
  # AgentFull is located under Assets in this workspace, so the Unity project
  # root is two levels above this file's parent folder.
  root_path: "../.."
  assets_path: ".."
  scripts_path: "../Scripts"
  editor_path: "../Editor"
  scenes_path: "../Scenes"
  prefabs_path: "../Prefabs"
  resources_path: "../Resources"
  streaming_assets_path: "../StreamingAssets"
  addressables_path: "../AddressableAssetsData"
  reports_path: "./reports"

generation_policy:
  default_output_mode: report_only
  allow_modify_existing_files: false
  allow_scene_modification: false
  allow_prefab_modification: false
  allow_scriptableobject_modification: false
  allow_streamingassets_modification: false
  allow_addressables_modification: false
  generate_code_to_report_folder_first: true

risk_policy:
  skip_high_risk_candidate: true
  prefer_low_risk_feature: true
  readonly_first: true
